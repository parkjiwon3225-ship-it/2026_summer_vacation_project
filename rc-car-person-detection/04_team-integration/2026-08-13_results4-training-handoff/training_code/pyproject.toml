[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rc-person-detector"
version = "0.1.0"
description = "Custom lightweight anchor-free person detector for an RC car"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "Pillow",
    "torch",
]

[tool.setuptools.packages.find]
where = ["src"]
