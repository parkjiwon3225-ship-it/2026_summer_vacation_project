name: Import RC Car AI Model

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  import-ai-model:
    if: github.event.head_commit.message == 'Initialize RC car AI model import'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout personal repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone source ai-model branch
        run: |
          git clone --depth 1 --branch ai-model https://github.com/GGulBe/rc-car-project.git /tmp/rc-car-project

      - name: Import AI model project
        run: |
          test ! -e rc-car-person-detection
          cp -a /tmp/rc-car-project/ai-model ./rc-car-person-detection

      - name: Create personal project index
        run: |
          cat > README.md <<'EOF'
          # 2026 Summer Vacation Projects

          2026년 여름방학 동안 진행한 개발 프로젝트와 실험 기록을 정리하는 개인 저장소입니다.

          ## RC Car Person Detection

          Raspberry Pi 4 + PiCar-X 기반 RC카에서 실시간으로 사람을 탐지하기 위한 경량 객체 탐지 모델 개발 프로젝트입니다.

          - 프로젝트 폴더: [`rc-car-person-detection/`](./rc-car-person-detection/)
          - 원본 협업 저장소: `GGulBe/rc-car-project`
          - 원본 브랜치: `ai-model`
          - 최종 선택 모델: Tail004
          - 개발 흐름: 데이터 분석 → 모델 설계 → 반복 학습/비교 → ONNX/INT8 경량화 → Raspberry Pi 실차 벤치마크 → 최종 모델 선정

          세부 실험 과정, 비교 결과, 배포 자료 및 최종 릴리스는 프로젝트 폴더의 README와 각 단계별 디렉터리에 정리되어 있습니다.
          EOF

      - name: Commit imported project
        run: |
          git config user.name "Jiwon Park"
          git config user.email "parkjiwon3225@gmail.com"
          git add -- README.md rc-car-person-detection
          git commit -m "Import RC car person detection AI project"
          git push origin main
